[hosts.zed]
# HH-3 — was transport="hook", status="stable", config_target=".../extensions.json".
# Three things wrong at once, and `integrations/README.md:28` said so in the repo
# the whole time: Zed is marked there as future work, its real path is "MCP
# context server approach", and the extension is "a larger build". The
# config_target named the wrong file too — the MCP path is configured in
# settings.json under `context_servers`, not extensions.json.
#
# What the 2026-05-09 note actually verified was the RECEIVING end: a synthetic
# POST to /api/v2/channels/turns landed in gateway.db tagged as zed. That is the
# gateway accepting a turn, not Zed sending one. No Zed extension exists, so
# nothing on Zed's side can call `zed-session` — which is why the hook
# subcommand still exists in vodou-hook and is not the declared transport.
transport = "mcp"
surface = "zed"
hook_subcommand = "zed-session"
verbs = ["bootstrap", "prompt", "record_turn", "recall", "flush"]
config_target = "~/.config/zed/settings.json"
status = "planned"
notes = "PLANNED. Today's working path is MCP: add Vodou under `context_servers` in Zed's settings.json (integrations/zed/README.md, path 1). The `zed-session` hook exists and its receiving end was verified 2026-05-09 by POSTing a synthetic turn, but no Zed extension exists to call it — path 2 is a Rust/WASM build nobody has done."

[hosts.continue-dev]
transport = "hook"
surface = "continue-dev"
hook_subcommand = "continue-session"
