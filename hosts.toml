# hosts.toml — registry of every LLM host Vodou supports.
#
# Source of truth for `vodou-core hosts` (the matrix runner) and any
# adapter that needs to look up a host's transport / surface / verb shape.
#
# Per PLANS/0.5.73/PLAN-HOST-ADAPTER-UNIFICATION.md §4.
#
# RULES:
#   1. Every entry's `surface` field MUST match a variant of
#      `crate::continuity::Surface` (`src/continuity/principal.rs`). Adding
#      a new host requires adding the Surface variant FIRST, then this
#      stanza, then the adapter shim.
#      EXCEPTION (schema 2): `transport = "extension"` hosts use the
#      registry-only label `surface = "browser-extension"`. Their turns land
#      under the extension's own ids (`webcap:` / `brainctx:`), outside
#      `workbench:surface:*`, so there is no Surface variant to stamp and
#      adding one would be a declared-but-dead enum arm. Making the extension
#      lane stamp a real Surface is its own item (PLAN-HOST-REGISTRY-FALSIFIABLE
#      P5a), not an instrument fix.
#   2. `transport` is one of: "hook" | "gateway" | "mcp" | "extension" | "none".
#   3. `verbs` is the subset of {bootstrap, prompt, record_turn, recall,
#      flush} the host actually calls. `record_turn` and `recall` are the
#      continuity chokepoints — every stable host SHOULD include them.
#      Omit a verb the host never calls; do not declare it and let it grade
#      `unmeasured` — that is the inverse of what this file is for.
#   4. `status` is one of: "stable" | "planned" | "unsupported".
#      An `unsupported` host is still GRADED against gateway.db. If rows
#      exist for it, `vodou-core hosts` renders the row CONTRADICTED and
#      exits 2. The declaration is a claim; the rows decide.
#   5. `evidence_ids` names the conversation-id / source prefixes that
#      belong to this host, matched as `LIKE '<prefix>%'` — never `%…%`.
#      REQUIRED for `transport = "extension"` and for any host whose
#      `surface` is a placeholder; optional elsewhere, where it replaces the
#      `%name%` / `%surface%` guess. (`chatgpt-web` never matched its rows
#      `webcap:chatgpt`; the placeholder `web` matched everything.)
#
# Schema version — bump when adding/removing fields:
#   1 → 2 (2026-09-02): + `evidence_ids`, + transport "extension". Additive;
#   a v1 file still loads.
schema_version = 2

# ─────────────────────────────────────────────────────────────────────────────
# 1. Hook-path hosts — IDE/CLI agents with native session lifecycle.
# ─────────────────────────────────────────────────────────────────────────────

[hosts.claude-code]
transport = "hook"
surface = "claude-code-hook"
hook_subcommand = "sock prompt"
verbs = ["bootstrap", "prompt", "record_turn", "recall", "flush"]
config_target = ".claude/settings.json"
status = "stable"
notes = "live-verified via continuity §23 + §31 + §34 (hook write lands in canonical gateway.db with principal_id stamped)"

[hosts.cursor]
transport = "hook"
surface = "cursor-hook"
hook_subcommand = "cursor-session"
verbs = ["bootstrap", "prompt", "record_turn", "recall", "flush"]
config_target = ".cursor/hooks.json"
status = "stable"

[hosts.cli]
transport = "hook"
surface = "cli"
hook_subcommand = "context"
verbs = ["bootstrap"]
status = "stable"
notes = "one-shot markdown print; no session lifecycle"

