# 3. Unsupported (registered so `vodou-core hosts` can explain why).
# ─────────────────────────────────────────────────────────────────────────────

[hosts.chatgpt-web]
transport = "extension"
surface = "browser-extension"   # registry-only label — see RULES 1
evidence_ids = ["webcap:chatgpt", "brainctx:chatgpt"]
verbs = ["prompt", "record_turn", "recall"]
status = "stable"
notes = "Extension content script (extension/vodou-bridge/content.js) intercepts the composer on chatgpt.com: Ctrl+B / auto-attach inject via vbb/chat.ts handleBrainRequest (memory+tools+skills → brainctx:chatgpt), capture lands under webcap:chatgpt. Measured 2026-09-02: webcap 33 convs / 541 msgs newest 2026-09-02, brainctx 2 / 168 newest 2026-08-11. Was declared unsupported until 2026-09-02 — the reason ('no pre-LLM hook') predated the extension. No bootstrap/flush: the extension has no session start/end hook."

[hosts.claude-ai-web]
transport = "extension"
surface = "browser-extension"   # registry-only label — see RULES 1
