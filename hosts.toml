# MS-6a — `teams` and `signal` are first-class `ChannelType`s with real adapters
# (`Vodou-channels/src/channels/{teams,signal}.ts`) and a slot in every
# `connect_channel` enum, and they had no stanza here. They also had no
# `Surface` variant, so `POST /api/v2/channels/turns` answered
# `unknown surface: teams` with a 400 — the audit filed a missing stanza and the
# route underneath it was refusing the turn. Variant, parser, OpenAPI enum and
# these stanzas all landed together on 2026-09-06; a source gate in
# `principal.rs` now fails if the four ever disagree again.
#
# Status is `planned`, not `stable`: the plumbing is there, nothing has sent a
# turn through it yet, and `vodou-core hosts` grades from gateway.db rows. An
# unproven claim is what this file has already been wrong about once (HH-2).
[hosts.teams]
transport = "gateway"
surface = "teams"
pipeline = "brainloader"
verbs = ["bootstrap", "prompt", "record_turn", "recall", "flush"]
status = "planned"
notes = "Adapter and outbound REST exist (channels/teams.ts, teams-outbound-rest.ts). Surface variant added 2026-09-06; no turn has been recorded through it yet."

