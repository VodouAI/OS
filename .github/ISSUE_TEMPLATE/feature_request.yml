name: Feature request
description: Suggest an improvement to the open client surface
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas welcome! Note Vodou is **open-core** — the client/extension/skills/docs are
        open here; the engine is proprietary. Requests to the open surface are the ones we
        can take as contributions.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The user need, not just the feature. What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to help implement this
