'browser-tools-stdio::takeScreenshot.url' = 'conditional:if_contains:http|then:regex:(https?://[^\\s]+)|else:default:null'
"browser-tools-stdio::takeScreenshot.text" = "remove:screenshot,capture,image,picture,photo,get,take,of,for,with,the,a,an"

# Navigation tool
'browser-tools-stdio::navigateToPage.url' = 'conditional:if_contains:http|then:regex:(https?://[^\\s]+)|else:template:https://{{regex:(?:navigate|go|visit|open|fetch)\\s+(.+)}}'

# Console logs
'browser-tools-stdio::getConsoleLogs.url' = 'conditional:if_contains:http|then:regex:(https?://[^\\s]+)|else:default:null'

# Page content
'browser-tools-stdio::getPageContent.url' = 'conditional:if_contains:http|then:regex:(https?://[^\\s]+)|else:default:null'

