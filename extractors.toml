"context7::query-docs.libraryId" = "regex:(/[a-zA-Z0-9._-]+(?:/[a-zA-Z0-9._-]+)*(?:/[a-zA-Z0-9._-]+)?)"
"context7::resolve-library-id.libraryId" = "map:react=/facebook/react,vue=/vuejs/vue,angular=/angular/angular,express=/expressjs/express,fastapi=/tiangolo/fastapi,django=/django/django,flask=/pallets/flask,spring=/spring-projects/spring-boot,laravel=/laravel/laravel,rails=/rails/rails,nextjs=/vercel/next.js,nuxt=/nuxt/nuxt,svelte=/sveltejs/svelte,typescript=/microsoft/typescript,python=/python/cpython,java=/openjdk/jdk,go=/golang/go,rust=/rust-lang/rust,node=/nodejs/node,mongodb=/mongodb/mongo,postgresql=/postgres/postgres,redis=/redis/redis,docker=/docker/docker,kubernetes=/kubernetes/kubernetes,firebase=/firebase/firebase-js-sdk,supabase=/supabase/supabase,stripe=/stripe/stripe-node"
"context7::query-docs.query" = "template:{{query}}"

