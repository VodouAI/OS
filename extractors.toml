# uml-mcp - Parameter Extractors (from oi-manifest.json)
# ============================================================================

'uml-mcp::generate_uml.diagram_type' = 'regex:(?:diagram[\\s_-]?type|type)[\\s:]+(class|sequence|activity|usecase|state|component|deployment|object)|regex:(class|sequence|activity|usecase|state|component|deployment|object)\\s+diagram|regex:(class model|sequence model|state machine|component model|deployment model|object model)|default:class'
"uml-mcp::generate_uml.code" = "template_select:class diagram=plantuml_class,class model=plantuml_class,sequence diagram=plantuml_sequence,sequence model=plantuml_sequence,activity diagram=plantuml_activity,workflow=plantuml_activity,usecase=plantuml_usecase,use case=plantuml_usecase,state diagram=plantuml_state,state machine=plantuml_state,component diagram=plantuml_component,component model=plantuml_component,deployment diagram=plantuml_deployment,deployment model=plantuml_deployment,object diagram=plantuml_object,object model=plantuml_object,mermaid=mermaid_flowchart,d2=d2_basic,graphviz=graphviz_basic,dot=graphviz_basic,erd=erd_basic,entity relationship=erd_basic|default:plantuml_class"


# ============================================================================
# Vodou-script-executor - Parameter Extractors
# ============================================================================

# The execute_script tool needs server_name and script_name
# We use the keyword from the intent to look up in script_intent_metadata
# Extract the full query as server_name (it should match the keyword from intent)
"Vodou-script-executor::execute_script.server_name" = "regex:^(.+)$"
"Vodou-script-executor::execute_script.script_name" = "default:execute_script"
"Vodou-script-executor::execute_script.params" = "default:{}"

# Parameter extraction for job search background script
# Extract search_term from queries like "background job search for CTO"
'Vodou-script-executor::execute_script.params.search_term' = 'regex:(?:for|search|find|jobs? for|positions? for)\\s+([^\\s]+(?:\\s+[^\\s]+)*?)(?:\\s+(?:in|at|near|around|remote))|(?:background\\s+)?(?:job\\s+)?search\\s+(.+?)(?:\\s+(?:in|at|near|around|remote))'
'Vodou-script-executor::execute_script.params.location' = 'regex:(?:in|at|near|around)\\s+([A-Za-z][^,]+(?:,\\s*[A-Z]{2})?)'
"Vodou-script-executor::execute_script.params.remote" = "regex:(remote|work from home|wfh)"
'Vodou-script-executor::execute_script.params.results' = 'regex:([0-9]+)\\s*(?:jobs?|results?|positions?)'

