# context7 - Parameter Extractors (from oi-manifest.json)
# ============================================================================

'context7::resolve-library-id.libraryName' = 'conditional:if_contains:/|then:regex:(/[a-zA-Z0-9._-]+(?:/[a-zA-Z0-9._-]+)?(?:/[a-zA-Z0-9._-]+)?)|else:regex:(?:for|about|with|using|library|docs?|documentation)\\s+([a-zA-Z0-9._-]+(?:[a-zA-Z0-9._-]+)?)|else:regex:([a-zA-Z0-9._-]+(?:[a-zA-Z0-9._-]+)?)$'
