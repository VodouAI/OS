# vodou-core skills - Parameter Extractors for Skill System
# ============================================================================

# Skill name extraction for load_skill tool
"vodou-core::vc_load_skill.skill_name" = "default:mastery"

# Skill-specific extractors for different queries
"skill_name_mastery" = "conditional:if_contains:oi mastery|then:literal:mastery|else:conditional:if_contains:learn oi|then:literal:mastery|else:default:mastery"
"skill_name_docker" = "conditional:if_contains:docker|then:literal:docker-compose-dev|else:default:docker-compose-dev"
"skill_name_development" = "conditional:if_contains:skill development|then:literal:skill-development|else:default:skill-development"
"skill_name_analysis" = "conditional:if_contains:parallel code analysis|then:literal:parallel-code-analysis|else:default:parallel-code-analysis"

# Search keyword extraction for search_skills tool
"vodou-core::vc_search_skills.keyword" = "remove:search,find,skills,skill,for,with,the,a,an,available"

# ============================================================================
# Vodou-Enhanced-Thinking - Parameter Extractors (from oi-manifest.json)
# ============================================================================

# Extract topic by removing trigger phrases and getting content after "about"
# Simple regex to extract everything after trigger phrase (with optional "about")
# If regex doesn't match, fallback to full query (template:{{query}})
'Vodou-Enhanced-Thinking::start_thinking_session.topic' = 'regex:(?i)(?:deep\\s+think|think\\s+deep|deep\\s+research|analyze\\s+deeply|comprehensive\\s+analysis)\\s+(?:about\\s+)?(.+)|default:template:{{query}}'
'Vodou-Enhanced-Thinking::start_thinking_session.estimated_steps' = 'regex:(?:in|with|using)\\s+(\\d+)\\s+steps?|default:5'
"Vodou-Enhanced-Thinking::add_thought.session_id" = "lookup:active_thinking_session"
"Vodou-Enhanced-Thinking::add_thought.thought" = "template:{{query}}"
'Vodou-Enhanced-Thinking::add_thought.thoughtNumber' = 'regex:(?:step|thought)\\s+(\\d+)|default:1'
'Vodou-Enhanced-Thinking::add_thought.totalThoughts' = 'regex:(?:of|in)\\s+(\\d+)|default:5'
"Vodou-Enhanced-Thinking::add_thought.nextThoughtNeeded" = "conditional:if_contains:done,finished,complete|then:default:false|else:default:true"
"Vodou-Enhanced-Thinking::get_thought_context.session_id" = "lookup:active_thinking_session"
"Vodou-Enhanced-Thinking::analyze_thinking.session_id" = "lookup:active_thinking_session"

# ============================================================================
# VODOU-RECALL — memory mutation (Phase 2 PLAN-MEMORY-CORRECT)
# ============================================================================
'Vodou-Recall::memory_store.text' = 'regex:(?i)(?:remember that|save to memory|note to memory|store this)\\s*:?\\s*(.+)|default:template:{{query}}'
'Vodou-Recall::memory_correct.right' = 'regex:(?i)(?:actually(?: it.?s)?|correction|correct(?:ed)?(?: fact)?(?: is)?|right(?: fact)?(?: is)?)\\s*:?\\s*(.+)|default:template:{{query}}'
'Vodou-Recall::memory_correct.wrong' = 'regex:(?i)(?:not|was wrong|wrong(?:ly)?(?:\\s+(?:said|remembered))?|instead of|not lucy.?s)\\s+(.{8,})'
'Vodou-Recall::memory_reject.chunk_id' = 'regex:(memory/[\\w./:-]+|[\\w./-]+:\\d+:[a-f0-9]+)'
'Vodou-Recall::memory_reject.snippet' = 'regex:(?i)(?:forget|reject|remove)\\s+(?:memory\\s+)?(.{6,})|default:template:{{query}}'
'Vodou-Recall::memory_pin.chunk_id' = 'regex:(memory/[\\w./:-]+|[\\w./-]+:\\d+:[a-f0-9]+)'
'Vodou-Recall::memory_unpin.chunk_id' = 'regex:(memory/[\\w./:-]+|[\\w./-]+:\\d+:[a-f0-9]+)'

# ============================================================================
# VODOU-CHANNELS - Multi-platform messaging & voice
# ============================================================================

# channel_connect — extract channel names from query
'Vodou-channels::channel_connect.channels' = 'regex:(?:telegram|slack|discord|voice|web)(?:\\s*(?:,|and|&)\\s*(?:telegram|slack|discord|voice|web))*|default:["web"]'

# channel_disconnect — extract channel names
'Vodou-channels::channel_disconnect.channels' = 'regex:(?:telegram|slack|discord|voice|web)(?:\\s*(?:,|and|&)\\s*(?:telegram|slack|discord|voice|web))*'

# channel_send — extract channel, recipient, message
'Vodou-channels::channel_send.channel' = 'regex:(?:to|on|via)\\s+(telegram|slack|discord|web)|default:web'
'Vodou-channels::channel_send.recipient' = 'regex:(?:to|user|recipient)\\s+([\\w@]+)|default:all'
'Vodou-channels::channel_send.message' = 'remove:send,message,to,channel,telegram,slack,discord,web,via,on,user'

# channel_broadcast — extract message
'Vodou-channels::channel_broadcast.message' = 'remove:broadcast,announce,send,to,all,channels,message'

# channel_status — extract optional channel name
'Vodou-channels::channel_status.channel' = 'regex:(?:status|health)\\s+(?:of\\s+)?(telegram|slack|discord|voice|web)'

# voice_speak — extract text to speak
'Vodou-channels::voice_speak.text' = 'remove:speak,say,voice,talk,read,aloud,text,to,speech,tts,please'

# voice_list_voices — no params needed

# ============================================================================
# TEMPLATES - Named templates for template_select extractor pattern
# ============================================================================
# Each template uses {{query}} / {{title}} for variable substitution.
# Referenced by template_select patterns above (e.g. uml-mcp::generate_uml.code).

# ============================================================================
# SLACK-MCP-SERVER - Parameter Extractors (@jtalk22/slack-mcp)
# ============================================================================

# slack_search_messages — extract search query
"slack-mcp-server::slack_search_messages.query" = "remove:search,slack,find,in,for,with,the,a,an,messages,message"

# slack_send_message — extract channel and text
'slack-mcp-server::slack_send_message.channel_id' = 'regex:(?:in|to|channel)[\s:]+([A-Z][A-Z0-9]{8,})|regex:#([\w-]+)|remove:send,slack,message,to,in,on,the,a,an'
'slack-mcp-server::slack_send_message.text' = 'regex:(?:saying|message|say|text)[\s:]+(.+?)(?:\s+(?:in|to|on)\b|$)|remove:send,slack,message,to,in,on,channel,the,a,an'

# slack_conversations_history — extract channel and limit
'slack-mcp-server::slack_conversations_history.channel_id' = 'regex:(?:in|from|channel)[\s:]+([A-Z][A-Z0-9]{8,})|regex:#([\w-]+)|remove:slack,history,messages,in,from,channel,the,a,an,show,get'
'slack-mcp-server::slack_conversations_history.limit' = 'conditional:if_matches:\d+|then:regex:\b(\d+)\b|else:default:20'

# slack_conversations_unreads — extract limit
'slack-mcp-server::slack_conversations_unreads.limit' = 'conditional:if_matches:\d+|then:regex:\b(\d+)\b|else:default:10'

# slack_list_conversations — extract types and limit
"slack-mcp-server::slack_list_conversations.types" = "conditional:if_contains:dm,direct|then:literal:im|else:conditional:if_contains:private|then:literal:private_channel|else:default:public_channel,private_channel,im"
'slack-mcp-server::slack_list_conversations.limit' = 'conditional:if_matches:\d+|then:regex:\b(\d+)\b|else:default:20'

# slack_list_users — extract limit
'slack-mcp-server::slack_list_users.limit' = 'conditional:if_matches:\d+|then:regex:\b(\d+)\b|else:default:50'

# ============================================================================
# vodou-mac-control - Parameter Extractors
# ============================================================================

# screenshot — extract window name or default to full screen
'vodou-mac-control::screenshot.window' = 'remove:screenshot,capture,screen,computer,mac,take,of,the,a,an,my'
"vodou-mac-control::screenshot.fullScreen" = "conditional:if_contains:full screen,desktop,entire,all|then:default:true|else:default:false"

# list_windows — no required params
# (no extractors needed — tool takes no arguments)

# manage_window — extract window title and action
'vodou-mac-control::manage_window.title' = 'remove:window,focus,move,minimize,resize,manage,the,a,my,to'
"vodou-mac-control::manage_window.action" = "conditional:if_contains:minimize|then:literal:minimize|else:conditional:if_contains:focus,activate,bring|then:literal:focus|else:conditional:if_contains:move|then:literal:move|else:conditional:if_contains:resize|then:literal:resize|else:default:focus"

# open_and_traverse — extract app name
'vodou-mac-control::open_and_traverse.appName' = 'remove:open,launch,start,app,application,the,a,an,and,traverse,show,me'

# traverse — extract app name
'vodou-mac-control::traverse.appName' = 'remove:traverse,inspect,ui,tree,elements,accessibility,app,read,the,a,of,in'

# click_element_and_traverse — extract app name and text to click
'vodou-mac-control::click_element_and_traverse.appName' = 'regex:(?:in|on|for)\s+(\w[\w\s]*?)(?:\s+(?:click|button|the|and)|$)'
'vodou-mac-control::click_element_and_traverse.text' = 'regex:(?:click|press|tap)\s+(?:on\s+)?(?:the\s+)?["\x27]?(\w[\w\s]*?)["\x27]?(?:\s+(?:in|on|button)|$)'

# click_and_traverse — extract coordinates
'vodou-mac-control::click_and_traverse.appName' = 'regex:(?:in|on)\s+(\w[\w\s]*?)(?:\s+at|$)'
'vodou-mac-control::click_and_traverse.x' = 'regex:(?:at\s+)?(\d+)\s*[,x]\s*\d+'
'vodou-mac-control::click_and_traverse.y' = 'regex:\d+\s*[,x]\s*(\d+)'

# type_and_traverse — extract app name and text to type
'vodou-mac-control::type_and_traverse.appName' = 'regex:(?:in|into)\s+(\w[\w\s]*?)$'
'vodou-mac-control::type_and_traverse.text' = 'regex:(?:type|enter)\s+["\x27]?(.+?)["\x27]?\s+(?:in|into)'

# press_key_and_traverse — extract app name and key combo
'vodou-mac-control::press_key_and_traverse.appName' = 'regex:(?:in|on)\s+(\w[\w\s]*?)$'
'vodou-mac-control::press_key_and_traverse.key' = 'regex:(?:press|hit|key)\s+(.+?)(?:\s+(?:in|on)|$)'

# scroll_and_traverse — extract app name and direction
'vodou-mac-control::scroll_and_traverse.appName' = 'regex:(?:in|on)\s+(\w[\w\s]*?)$'
"vodou-mac-control::scroll_and_traverse.direction" = "conditional:if_contains:up|then:literal:up|else:conditional:if_contains:left|then:literal:left|else:conditional:if_contains:right|then:literal:right|else:default:down"
"vodou-mac-control::scroll_and_traverse.amount" = "default:3"

# clipboard_read — no required params
# clipboard_write — extract text to write
'vodou-mac-control::clipboard_write.text' = 'remove:copy,write,set,clipboard,to,the,a'

# check_permission — no required params

[templates.plantuml_class]
content = "@startuml\nTitle: {{query}}\n\nclass User {\n-String name\n-String email\n+login()\n+logout()\n}\n\nclass System {\n-String version\n+process()\n}\n\nUser --> System : uses\n@enduml"

[templates.plantuml_sequence]
content = "@startuml\nTitle: {{query}}\n\nparticipant User\nparticipant System\nparticipant Database\n\nUser -> System : request\nSystem -> Database : query\nDatabase --> System : response\nSystem --> User : result\n@enduml"

[templates.plantuml_activity]
content = "@startuml\nTitle: {{query}}\n\nstart\n:Initialize;\n:Process request;\nif (Valid?) then (yes)\n  :Execute;\nelse (no)\n  :Handle error;\nendif\n:Complete;\nstop\n@enduml"

[templates.plantuml_usecase]
content = "@startuml\nTitle: {{query}}\n\nactor User\nactor Admin\n\nrectangle System {\n  usecase \"Login\"\n  usecase \"View Data\"\n  usecase \"Manage Users\"\n}\n\nUser --> \"Login\"\nUser --> \"View Data\"\nAdmin --> \"Manage Users\"\n@enduml"

[templates.plantuml_state]
content = "@startuml\nTitle: {{query}}\n\n[*] --> Initial\nInitial --> Processing : start\nProcessing --> Completed : success\nProcessing --> Error : failure\nError --> Processing : retry\nCompleted --> [*]\n@enduml"

[templates.plantuml_component]
content = "@startuml\nTitle: {{query}}\n\ncomponent [Web Interface]\ncomponent [API Server]\ncomponent [Database]\n\n[Web Interface] --> [API Server] : HTTP\n[API Server] --> [Database] : SQL\n@enduml"

[templates.plantuml_deployment]
content = "@startuml\nTitle: {{query}}\n\nnode \"Web Server\" {\n  artifact [Web App]\n}\nnode \"Database Server\" {\n  database [PostgreSQL]\n}\n\n[Web App] --> [PostgreSQL] : connects\n@enduml"

[templates.plantuml_object]
content = "@startuml\nTitle: {{query}}\n\nobject user1 as \"User: John\"\nobject user2 as \"User: Jane\"\nobject system1 as \"System: Main\"\n\nuser1 --> system1 : uses\nuser2 --> system1 : uses\n@enduml"

[templates.mermaid_flowchart]
content = "graph TD\n    A[Start] --> B{Decision}\n    B -->|Yes| C[Action 1]\n    B -->|No| D[Action 2]\n    C --> E[End]\n    D --> E"

[templates.d2_basic]
content = "title: {{query}}\n\nuser: {\n  label: User\n  shape: person\n}\n\nsystem: {\n  label: System\n  shape: rectangle\n}\n\ndatabase: {\n  label: Database\n  shape: cylinder\n}\n\nuser -> system: interacts\nsystem -> database: stores data"

[templates.graphviz_basic]
content = "digraph G {\n    rankdir=TB;\n    node [shape=box, style=filled, fillcolor=lightblue];\n    edge [color=black];\n    \n    A [label=\"Start\"];\n    B [label=\"Process\"];\n    C [label=\"End\"];\n    \n    A -> B;\n    B -> C;\n}"

[templates.erd_basic]
content = "@startuml\nTitle: {{query}}\n\nentity User {\n  * id : INT\n  --\n  * name : VARCHAR(100)\n  * email : VARCHAR(255)\n  created_at : TIMESTAMP\n}\n\nentity Order {\n  * id : INT\n  --\n  * user_id : INT\n  * total : DECIMAL(10,2)\n  status : VARCHAR(50)\n}\n\nUser ||--o{ Order : places\n@enduml"
