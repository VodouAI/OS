"Vodou-session-manager::create_session.server_name" = "remove:create,session,for,the,a,an"
"Vodou-session-manager::create_session.timeout" = "default:3600"
"Vodou-session-manager::create_session.metadata" = "default:{}"

# list_sessions - Optional server filter
"Vodou-session-manager::list_sessions.server_name" = "optional:"

# close_session - Extract session_id from query or default
"Vodou-session-manager::close_session.session_id" = "remove:close,end,stop,session,the,a,my"

# session_status - Extract session_id from query or default
"Vodou-session-manager::session_status.session_id" = "remove:session,status,check,show,info,the,a,my"

