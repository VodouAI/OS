"chrome-devtools::navigate_page.url" = "conditional:if_contains:http|then:regex:https?://[^\\s]+|else:regex:\\b([a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*\\.[a-zA-Z]{2,})\\b"
