<!doctype html>
<html lang="en" data-theme="dark" data-palette="brand">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brain — everything Vodou remembers</title>
  <!-- PLAN-BRAIN-INTO-CONSOLE: this standalone shell is the OPT-IN twin of the
       Console's #/memory Map tab (VODOU_BRAIN_STANDALONE=1). The graph itself —
       js/app.js, js/brain-template.js, css/brain.css, css/tokens.css,
       js/vocabulary.js — are BUILD COPIES of the Console's files, written by
       scripts/vendor-assets.mjs. Edit them in MCP-servers/Vodou-Console/public. -->
  <script>
    (function () {
      var PALETTES = ['brand','ritual','ember','moss','ocean','crimson','violet','rose','graphite','glacier','espresso','saffron','blush','lilac','mint','powder','seafoam','peach','lime','cobalt','magenta','tangerine','burgundy','olive'];
      function apply(theme, palette) {
        if (theme !== 'light' && theme !== 'dark') theme = 'dark';
        if (PALETTES.indexOf(palette) < 0) palette = 'brand';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-palette', palette);
      }
      // Server injects data-theme/data-palette on <html>. Refresh from file via API
      // so a long-lived tab can pick up Console changes on reload.
      try {
        var x = new XMLHttpRequest();
        x.open('GET', '/api/appearance', false);
        x.send(null);
        if (x.status === 200) {
          var j = JSON.parse(x.responseText);
          apply(j.theme, j.palette);
          return;
        }
      } catch (e) { /* keep server-injected attrs */ }
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/brain.css">
  <link rel="stylesheet" href="/css/brain-standalone.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div id="brain" class="brain-root"></div>

  <script src="/vendor/d3.min.js"></script>
  <script src="/js/vocabulary.js"></script>
  <script src="/js/brain-template.js"></script>
  <script src="/js/app.js"></script>
  <script>
    (function () {
      var gw = location.protocol + '//' + location.hostname + ':' + (window.VODOU_GATEWAY_PORT || 8765);
      var q = new URLSearchParams(location.search);
      window.brain = VodouBrain.mount(document.getElementById('brain'), {
        embedded: false,
        apiBase: '',          // graph reads stay on this server
        gatewayBase: gw,      // vault + conflict writes go to the gateway
        layout: q.get('layout') || undefined,
        node: q.get('node') || undefined,
        onLayout: function (layout) {
          var u = new URL(location.href);
          if (layout === 'constellation') u.searchParams.delete('layout');
          else u.searchParams.set('layout', layout);
          history.replaceState(null, '', u);
        },
      });
    })();
  </script>
</body>
</html>
