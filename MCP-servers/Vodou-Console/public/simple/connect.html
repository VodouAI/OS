<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connecting…</title>
<!--
  M2b — /connect?code=… landing. The install page at app.vodou.ai sends the
  browser here with a one-time connect code. This page POSTs the code to
  /api/onboarding/connect-device (the GET itself changes nothing — see the
  route comment in index.ts), and on success lands in /simple. The exchange
  happens gateway ↔ app.vodou.ai server-to-server; no key in the browser.
-->
<style>
  :root { --bg: #ffffff; --fg: #111111; --muted: #8e8e93; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --fg: #f2f2f7; --muted: #8e8e93; }
  }
  body {
    margin: 0; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
  }
  .card { max-width: 420px; padding: 24px; }
  .spin {
    width: 28px; height: 28px; margin: 0 auto 16px;
    border: 3px solid var(--muted); border-top-color: transparent;
    border-radius: 50%;
    animation: r 0.9s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  .muted { color: var(--muted); font-size: 14px; }
  a { color: inherit; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="spin" id="spin"></div>
  <div id="msg">Connecting this computer to your Vodou account…</div>
  <p class="muted hidden" id="hint"></p>
</div>
<script>
(function () {
  'use strict';
  var msg = document.getElementById('msg');
  var hint = document.getElementById('hint');
  var spin = document.getElementById('spin');

  function fail(text) {
    spin.classList.add('hidden');
    msg.textContent = text;
    hint.classList.remove('hidden');
    hint.innerHTML = 'Get a fresh link from <a href="https://app.vodou.ai/install">app.vodou.ai/install</a> (Connect this computer).';
  }

  var code = '';
  try { code = new URLSearchParams(location.search).get('code') || ''; } catch (e) {}
  if (!/^[a-f0-9]{48}$/.test(code)) {
    fail('This connect link is incomplete.');
    return;
  }
  // Drop the code from the address bar / history before exchanging it.
  try { history.replaceState(null, '', '/connect'); } catch (e) {}

  fetch('/api/onboarding/connect-device', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: code })
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; });
  }).then(function (res) {
    if (res.ok && res.j && res.j.ok) {
      msg.textContent = 'Connected. Opening your chat…';
      setTimeout(function () { location.replace('/simple'); }, 400);
    } else {
      fail((res.j && res.j.error) || 'This connect link has expired.');
    }
  }).catch(function () {
    fail('Could not reach Vodou on this computer — is it still starting up? Give it a few seconds and reload.');
  });
})();
</script>
</body>
</html>
